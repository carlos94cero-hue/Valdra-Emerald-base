
name: Valdara - compilacion de prueba

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Descargar codigo de Emerald
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 build-essential git make python3 python3-pil gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev

      - name: Preparar agbcc
        run: |
          git clone --depth 1 https://github.com/pret/agbcc.git /tmp/agbcc
          cd /tmp/agbcc && ./build.sh
          ./install.sh "$GITHUB_WORKSPACE"
        

      - name: Integrar sprites iniciales Valdara
        run: python3 valdara/generate_valdara_sprites.py

      - name: Compilar base Emerald
        run: make -j2 MODERN=1

      - name: Comprobar ROM compilada
        run: |
          find . -maxdepth 2 -name '*.gba' -type f -print
          test -n "$(find . -maxdepth 2 -name '*.gba' -type f -print -quit)"

      - name: Guardar ROM de prueba
        uses: actions/upload-artifact@v4
        with:
          name: valdara-protagonistas-prueba
          path: '*.gba'
          if-no-files-found: error
          retention-days: 3
